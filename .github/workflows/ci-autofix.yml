name: autofix.ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  autofix:
    uses: lumirelle/workflows/.github/workflows/ci-autofix.yml@v11
    permissions:
      contents: read
    with:
      # Oxlint's JS-plugin allocator reserves ~6 GiB; ubuntu-slim has only ~2.5 GiB of commit.
      primary-os: ubuntu-latest
      cache-preset: 'nub,eslint'
